# Set prefix to Ctrl-Space
unbind C-b

set -g prefix C-Space
bind C-Space send-prefix

# Send the *current* pane to a chosen window (prompts for target)
bind M-p command-prompt -p "create pane from:"  "join-pane -s ':%%'"

set-option -g default-shell /usr/bin/zsh

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# scrollback in nvim 
bind-key E run-shell '
  tmpfile="$(mktemp /tmp/tmux-scrollback-XXXXXX.log)" &&
  tmux capture-pane -pS -32768 > "$tmpfile" &&
  tmux new-window "nvim \"$tmpfile\""
  '

# Make the active pane's border more noticeable (arrows + color)
# Use 16-color names (not hex) so Ghostty day/night themes remap them
set -g pane-border-indicators both
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue,bold"

# Dim inactive pane *contents* (not just the title).
# "dim" is a no-op for most cells under Ghostty/truecolor; a mid-gray works in
# both day and night. Active must use fg=terminal (fg=default does not restore).
set -g window-style "fg=colour245,bg=terminal"
set -g window-active-style "fg=terminal,bg=terminal"

# Flash pane numbers longer (prefix + q)
set -g display-panes-time 2000
set -g display-panes-colour brightblack
set -g display-panes-active-colour blue

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
# set-option -g allow-rename off


# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# increase history size (from 2,000)
set -g history-limit 1000000

# use current path when opening new pane
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# (Optional) Keep numbering compact after closing a window
set -g renumber-windows on

# Truecolor (needed for hex colors + Nerd Font glyphs)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# App icons (single source of truth; __APP__ is replaced at use sites)
# NOTE: use spaces in #[...] inside #{?} — commas would split the conditional
set -g @app_icon "#{?#{m:*python*,__APP__}, ,#{?#{||:#{m:*pacman*,__APP__},#{m:*yay*,__APP__}},󰣇 ,#{?#{m:*claude*,__APP__}, ,#{?#{||:#{m:*psql*,__APP__},#{||:#{m:*postgres*,__APP__},#{m:*pg*,__APP__}}}, ,#{?#{m:*tmux*,__APP__}, ,#{?#{m:*note*,__APP__}, ,#{?#{||:#{m:*k9s*,__APP__},#{m:*kube*,__APP__}}, ,#{?#{m:*nvim*,__APP__}, ,#{?#{m:*cursor*,__APP__},󰚩 ,#{?#{m:*docker*,__APP__}, ,#{?#{m:*git*,__APP__}, ,#{?#{==:__APP__,zsh}, ,#{?#{==:__APP__,bash}, ,#{?#{==:__APP__,sh}, ,}}}}}}}}}}}}}}"
set -g @icon_for_window "#{E:#{s/__APP__/#{window_name}/:#{@app_icon}}}"
set -g @icon_for_pane "#{E:#{s/__APP__/#{pane_current_command}/:#{@app_icon}}}"

# NOTE: inside #{?} use spaces in #[...] — commas would split the conditional
set -g pane-border-format "#{?pane_active,#[fg=black bg=blue bold] 
 ,#[fg=brightblack]  }#{pane_index}:#{E:@icon_for_pane}#{pane_current_command} "

# Starship-styled status bar (palette from starship.toml)
set -g status-position bottom
set -g status-style "bg=#1d2230,fg=#a0a9cb"
set -g status-left-length 40
set -g status-right-length 120
set -g status-interval 1
set -g status-left "#[fg=#090c0c,bg=#a3aed2,bold] 📜 #S #[fg=#a3aed2,bg=#394260] "
set -g status-right "#[fg=#212736]#[fg=#a0a9cb,bg=#212736]  #h 󰻠 #(awk '/^cpu /{u=$2+$3+$4+$7+$8+$9; t=$2+$3+$4+$5+$6+$7+$8+$9; c=\"/tmp/tmux-cpu-pct\"; if ((getline l < c) > 0) { split(l, p); d=t-p[2]; if (d > 0) printf \"%%02d\", (u-p[1])*100/d; else printf \"%%02d\", 0 } else printf \"%%02d\", 0; close(c); print u, t > c }' /proc/stat)%% 󰍛 #(free | awk 'NR==2{printf \"%%02d\", int($3*100/$2)}')%% 🔌#(printf %%02d $(cat /sys/class/power_supply/BAT0/capacity))%% 🕐%H:%M "
setw -g window-status-separator ""
# Inactive: navy strip; last window closes into status bg
setw -g window-status-format "#[fg=#a0a9cb bg=#394260] #[bold]#I#[nobold]:#{E:@icon_for_window}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#394260 bg=#1d2230],}"
# Current: open from navy; if last close into status bg, else into navy strip
setw -g window-status-current-format "#[fg=#394260 bg=#769ff0]#[fg=#090c0c bg=#769ff0] 󰏒 #[bold]#I#[nobold]:#{E:@icon_for_window}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#769ff0 bg=#1d2230],#[fg=#769ff0 bg=#394260]}"
