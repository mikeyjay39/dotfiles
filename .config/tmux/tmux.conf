# Set prefix to Ctrl-Space
unbind C-b

set -g prefix C-Space
bind C-Space send-prefix

# Send the *current* pane to a chosen window (prompts for target)
bind M-p command-prompt -p "create pane from:"  "join-pane -s ':%%'"

set-option -g default-shell /usr/bin/zsh

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Jump to the agent pane that needs input (or else is done), in any session
bind a run-shell "~/.config/tmux/agent-jump.sh '#{client_name}'"

# scrollback in nvim
bind-key E run-shell '
  tmpfile="$(mktemp /tmp/tmux-scrollback-XXXXXX.log)" &&
  tmux capture-pane -pS -32768 > "$tmpfile" &&
  tmux new-window "nvim \"$tmpfile\""
  '

# Make the active pane's border more noticeable (arrows + color)
# Use 16-color names (not hex) so Ghostty day/night themes remap them
set -g pane-border-indicators both
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue,bold"

# Dim inactive pane *contents* (not just the title).
# "dim" is a no-op for most cells under Ghostty/truecolor; a mid-gray works in
# both day and night. Active must use fg=terminal (fg=default does not restore).
set -g window-style "fg=colour245,bg=terminal"
set -g window-active-style "fg=terminal,bg=terminal"

# Flash pane numbers longer (prefix + q)
set -g display-panes-time 2000
set -g display-panes-colour brightblack
set -g display-panes-active-colour blue

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
# set-option -g allow-rename off


# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# increase history size (from 2,000)
set -g history-limit 1000000

# use current path when opening new pane
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# (Optional) Keep numbering compact after closing a window
set -g renumber-windows on

# Truecolor (needed for hex colors + Nerd Font glyphs)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Claude Code settings for tmux focus events
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# App icons (single source of truth; __APP__ is replaced at use sites)
# NOTE: use spaces in #[...] inside #{?} — commas would split the conditional
set -g @app_icon "#{?#{m:*kaf*,__APP__},󱀏 ,#{?#{m:*python*,__APP__}, ,#{?#{||:#{m:*pacman*,__APP__},#{m:*yay*,__APP__}},󰣇 ,#{?#{m:*claude*,__APP__}, ,#{?#{||:#{m:*psql*,__APP__},#{||:#{m:*postgres*,__APP__},#{m:*pg*,__APP__}}}, ,#{?#{m:*tmux*,__APP__}, ,#{?#{m:*note*,__APP__}, ,#{?#{||:#{m:*k9s*,__APP__},#{m:*kube*,__APP__}}, ,#{?#{m:*nvim*,__APP__}, ,#{?#{m:*cursor*,__APP__},󰚩 ,#{?#{m:*docker*,__APP__}, ,#{?#{m:*git*,__APP__}, ,#{?#{m:*ssh*,__APP__},󰣀 ,#{?#{==:__APP__,zsh}, ,#{?#{==:__APP__,bash}, ,#{?#{==:__APP__,sh}, ,}}}}}}}}}}}}}}}}"
set -g @icon_for_window "#{E:#{s/__APP__/#{window_name}/:#{@app_icon}}}"
set -g @icon_for_pane "#{E:#{s/__APP__/#{pane_current_command}/:#{@app_icon}}}"

# Agent lifecycle (set by ~/.cursor/hooks/agent-tmux.sh via Cursor/Claude hooks)
# Color the glyph only — do not use #[default] (it clears the status/pane bg).
# NOTE: inside #{?} use spaces in #[...] — commas would split the conditional
set -g @agent_state_icon "#{?#{==:#{@agent-state},running},#[fg=yellow bold]󰑮 ,#{?#{==:#{@agent-state},needs-input},#[fg=red bold]󰀨 ,#{?#{==:#{@agent-state},done},#[fg=bold]✓ ,}}}"

# Session tree (prefix + s): the tmux 3.8 default tree format plus agent icons.
# A session row shows one icon: 󰀨 if any window needs input, else ✓ if any is done,
# else 󰑮 if any is running. Done wins over running because it needs your attention.
# NOTE: inside #{?} use spaces in #[...] — commas would split the conditional
set -g @agent_session_icon "#{?#{W:#{?#{==:#{@agent-state},needs-input},1,}},#[fg=red bold]󰀨 ,#{?#{W:#{?#{==:#{@agent-state},done},1,}},#[fg=green bold]✓ ,#{?#{W:#{?#{==:#{@agent-state},running},1,}},#[fg=yellow bold]󰑮 ,}}}"
set -g @agent_tree_format "#{?pane_format,#{E:@agent_state_icon}#[fg=default nobold]#{?pane_marked,#[fg=thememagenta],}#{?pane_floating_flag,#[underscore],}#{pane_current_command}#[fg=themelightgrey]#{pane_flags}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: \"#{pane_title}\",},window_format,#{E:@agent_state_icon}#[fg=default nobold]#{?window_marked_flag,#[fg=thememagenta],}#{window_name}#[fg=themelightgrey]#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: \"#{pane_title}\",},#{E:@agent_session_icon}#[fg=themelightgrey nobold]#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}"
bind s choose-tree -Zs -F "#{E:@agent_tree_format}"

# NOTE: inside #{?} use spaces in #[...] — commas would split the conditional
# Re-assert pane border colors after @agent_state_icon so command text keeps its bg/fg.
set -g pane-border-format "#{?pane_active,#[fg=black bg=blue bold] 
 ,#[fg=brightblack]  }#{pane_index}:#{E:@agent_state_icon}#{?pane_active,#[fg=black bg=blue bold],#[fg=brightblack]}#{E:@icon_for_pane}#{pane_current_command} "

# Starship-styled status bar (palette from starship.toml)
set -g status-position bottom
set -g status-style "bg=#1d2230,fg=#a0a9cb"
set -g message-style "fg=#090c0c,bg=#769ff0,fill=#769ff0,bold"
set -g message-command-style "fg=#090c0c,bg=#769ff0,fill=#769ff0,bold"
set -g status-left-length 40
set -g status-right-length 120
set -g status-interval 1
set -g status-left "#[fg=#090c0c,bg=#a3aed2,bold] 📜 #S #[fg=#a3aed2,bg=#394260] "
# Agents in *other* sessions that are done or need input, as "icon session:window".
# Text uses Tokyo Night blue (#7aa2f7); icons keep the @agent_state_icon colors.
# NOTE: inside #{?} use spaces in #[...] — commas would split the conditional
set -g @agent_elsewhere "#{S:#{?#{!=:#{session_name},#{client_session}},#{W:#{?#{==:#{@agent-state},needs-input},#[fg=red bold]󰀨 #[fg=#7aa2f7]#{session_name}:#{window_index} ,#{?#{==:#{@agent-state},done},#[fg=green bold]✓ #[fg=#7aa2f7]#{session_name}:#{window_index} ,#{?#{==:#{@agent-state},running},#[fg=yellow bold]󰑮 #[fg=#7aa2f7]#{session_name}:#{window_index} ,}}}},}}"
set -g status-right "#{E:@agent_elsewhere}#[fg=#212736 nobold]#[fg=#a0a9cb,bg=#212736]  #h 󰻠 #(awk '/^cpu /{u=$2+$3+$4+$7+$8+$9; t=$2+$3+$4+$5+$6+$7+$8+$9; c=\"/tmp/tmux-cpu-pct\"; if ((getline l < c) > 0) { split(l, p); d=t-p[2]; if (d > 0) printf \"%%02d\", (u-p[1])*100/d; else printf \"%%02d\", 0 } else printf \"%%02d\", 0; close(c); print u, t > c }' /proc/stat)%% 󰍛 #(free | awk 'NR==2{printf \"%%02d\", int($3*100/$2)}')%% 🔌#(printf %%02d $(cat /sys/class/power_supply/BAT0/capacity))%% 🕐%H:%M "
setw -g window-status-separator ""
# Inactive: navy strip; last window closes into status bg
# Re-assert strip colors after @agent_state_icon so #W keeps the navy/blue bg.
setw -g window-status-format "#[fg=#a0a9cb bg=#394260] #[bold]#I#[nobold]:#{E:@agent_state_icon}#[fg=#a0a9cb bg=#394260 nobold]#{E:@icon_for_window}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#394260 bg=#1d2230],}"
# Current: open from navy; if last close into status bg, else into navy strip
setw -g window-status-current-format "#[fg=#394260 bg=#769ff0]#[fg=#090c0c bg=#769ff0] 󰏒 #[bold]#I#[nobold]:#{E:@agent_state_icon}#[fg=#090c0c bg=#769ff0 nobold]#{E:@icon_for_window}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#769ff0 bg=#1d2230],#[fg=#769ff0 bg=#394260]}"

# Plugins (TPM itself comes from the system package, so no @plugin line for it)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save pane scrollback too, so restored panes are not empty
set -g @resurrect-capture-pane-contents 'on'
# Restore the last save automatically when the tmux server starts
set -g @continuum-restore 'on'
# Save every 5 minutes (default 15) to lose less work after a crash
set -g @continuum-save-interval '5'

# TMUX Plugin manager
run '/usr/share/tmux-plugin-manager/tpm'
