# Set prefix to Ctrl-Space
unbind C-b

set -g prefix C-Space
bind C-Space send-prefix

# Send the *current* pane to a chosen window (prompts for target)
bind M-p command-prompt -p "create pane from:"  "join-pane -s ':%%'"

# Send pane into new window
bind P break-pane

# split panes using | and -
# bind | split-window -h
# bind - split-window -v
# unbind '"'
# unbind %

# new window (tab)
bind -n M-t new-window

set-option -g default-shell /usr/bin/zsh

# next/previous window  ALT-t
bind -n M-T next-window

# switch to window by number (Alt-0 .. Alt-9)
# bind -n M-0 select-window -t :0
# bind -n M-1 select-window -t :1
# bind -n M-2 select-window -t :2
# bind -n M-3 select-window -t :3
# bind -n M-4 select-window -t :4
# bind -n M-5 select-window -t :5
# bind -n M-6 select-window -t :6
# bind -n M-7 select-window -t :7
# bind -n M-8 select-window -t :8
# bind -n M-9 select-window -t :9

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# scrollback in nvim 
bind-key E run-shell '
  tmpfile="$(mktemp /tmp/tmux-scrollback-XXXXXX.log)" &&
  tmux capture-pane -pS -32768 > "$tmpfile" &&
  tmux new-window "nvim \"$tmpfile\""
  '

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off


# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
setw -g pane-base-index 1

# increase history size (from 2,000)
set -g history-limit 1000000

# use current path when opening new pane
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# (Optional) Keep numbering compact after closing a window
set -g renumber-windows on

# Truecolor (needed for hex colors + Nerd Font glyphs)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Starship-styled status bar (palette from starship.toml)
set -g status-position bottom
set -g status-style "bg=#1d2230,fg=#a0a9cb"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 1
set -g status-left "#[fg=#090c0c,bg=#a3aed2,bold]   #S #[fg=#a3aed2,bg=#394260] "
set -g status-right "#[fg=#212736]#[fg=#a0a9cb,bg=#212736]   #h #[fg=#1d2230,bg=#212736]#[fg=#1d2230]#[fg=#a0a9cb,bg=#1d2230]  #(date -u +%%H:%%M) UTC   %H:%M "
setw -g window-status-separator ""
# Inactive: navy strip; last window closes into status bg
# NOTE: use spaces in #[...] inside #{?} — commas would split the conditional
setw -g window-status-format "#[fg=#a0a9cb bg=#394260] #I:#{?#{==:#{window_name},nvim}, ,#{?#{==:#{window_name},cursor-agent},󰚩 ,#{?#{==:#{window_name},zsh}, ,#{?#{==:#{window_name},bash}, ,#{?#{==:#{window_name},sh}, ,}}}}}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#394260 bg=#1d2230],}"
# Current: open from navy; if last close into status bg, else into navy strip
setw -g window-status-current-format "#[fg=#394260 bg=#769ff0]#[fg=#090c0c bg=#769ff0 bold] 󰏒 #I:#{?#{==:#{window_name},nvim}, ,#{?#{==:#{window_name},cursor-agent},󰚩 ,#{?#{==:#{window_name},zsh}, ,#{?#{==:#{window_name},bash}, ,#{?#{==:#{window_name},sh}, ,}}}}}#W#{?#{==:#{window_index},#{session_windows}},#[fg=#769ff0 bg=#1d2230],#[fg=#769ff0 bg=#394260]}"
